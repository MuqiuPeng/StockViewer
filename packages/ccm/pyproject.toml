[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccm"
version = "0.3.0"
description = "Convergent cross mapping and the state-space primitives it needs"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

# numpy only, deliberately. Two constraints from the host that runs this:
#   - the indicator venv carries numpy and pandas and nothing else, so every
#     added dependency has to be installed in two places (that venv and
#     data-service), and
#   - user-authored Python runs under an audit hook that blocks subprocess
#     creation, so a dependency reaching for a process pool fails at runtime
#     rather than at import.
# scipy would buy a KD-tree; the brute-force search in embedding.py is enough
# for the library sizes a daily series reaches.

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ccm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
