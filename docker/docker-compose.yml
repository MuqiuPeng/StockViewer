services:
  # Stock Data Service (数据获取服务)
  data-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data-service
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      - CACHE_TTL=300
      # ── EastMoney proxy (macOS Docker Desktop only) ────────────────────────
      # EastMoney is reachable via IPv6 on the Mac host but IPv4 from inside
      # Docker is refused.  Run an HTTP proxy on the host (clash, v2ray, etc.)
      # then uncomment the line below, replacing 7890 with your proxy port.
      #- HTTPS_PROXY=http://host.docker.internal:7890
      #- HTTP_PROXY=http://host.docker.internal:7890
      #- NO_PROXY=localhost,127.0.0.1,data-service,app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - stockviewer-network

  # Main StockViewer Application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AUTH_TRUST_HOST=true
      - DATA_SERVICE_URL=http://data-service:8000
      - DATA_SERVICE_TIMEOUT_MS=60000
      - DATA_SERVICE_RETRIES=2
      - PYTHON_EXECUTABLE=python3
      - PYTHON_TIMEOUT_MS=300000
    volumes:
      # Persist data between container restarts
      - stockviewer-csv:/app/data/csv
      - stockviewer-indicators:/app/data/indicators
      - stockviewer-strategies:/app/data/strategies
      - stockviewer-groups:/app/data/groups
      - stockviewer-backtest:/app/data/backtest-history
      - stockviewer-datasets:/app/data/datasets
      - stockviewer-viewsettings:/app/data/view-settings
    depends_on:
      data-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stockviewer-network

networks:
  stockviewer-network:
    driver: bridge

volumes:
  stockviewer-csv:
  stockviewer-indicators:
  stockviewer-strategies:
  stockviewer-groups:
  stockviewer-backtest:
  stockviewer-datasets:
  stockviewer-viewsettings:
