services:
  # Stock Data Service (数据获取服务)
  data-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data-service
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      - CACHE_TTL=300
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - stockviewer-network

  # Main StockViewer Application
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATA_SERVICE_URL=http://data-service:8000
      - DATA_SERVICE_TIMEOUT_MS=60000
      - DATA_SERVICE_RETRIES=2
      # Legacy AKTools (for backward compatibility during migration)
      - NEXT_PUBLIC_AKTOOLS_API_URL=http://aktools:8080
      - PYTHON_EXECUTABLE=python3
      - PYTHON_TIMEOUT_MS=300000
    volumes:
      # Persist data between container restarts
      - stockviewer-csv:/app/data/csv
      - stockviewer-indicators:/app/data/indicators
      - stockviewer-strategies:/app/data/strategies
      - stockviewer-groups:/app/data/groups
      - stockviewer-backtest:/app/data/backtest-history
      - stockviewer-datasets:/app/data/datasets
      - stockviewer-viewsettings:/app/data/view-settings
    depends_on:
      data-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stockviewer-network

  # Legacy AKTools API Service (可选，迁移完成后可移除)
  aktools:
    build:
      context: .
      dockerfile: Dockerfile.aktools
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - stockviewer-network
    profiles:
      - legacy  # 只有指定 --profile legacy 才会启动

networks:
  stockviewer-network:
    driver: bridge

volumes:
  stockviewer-csv:
  stockviewer-indicators:
  stockviewer-strategies:
  stockviewer-groups:
  stockviewer-backtest:
  stockviewer-datasets:
  stockviewer-viewsettings:
