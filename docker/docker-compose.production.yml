# Production deployment with PostgreSQL, Data Service and auth
# Usage:
#   1. Copy .env.production.example to .env.production and fill in values
#   2. docker compose -f docker/docker-compose.production.yml up -d

services:
  # Stock Data Service (数据获取服务)
  data-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.data-service
    environment:
      - LOG_LEVEL=info
      - CACHE_TTL=300
      - DATA_PROVIDER=eastmoney
      - LOG_INGEST_URL=http://stockviewer:3000/api/admin/logs/ingest/service
      - LOG_INGEST_SECRET=${LOG_INGEST_SECRET}
    dns:
      - 2001:4860:4860::8888
      - 8.8.8.8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - stockviewer-network

  stockviewer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.combined
      args:
        - NEXT_PUBLIC_BASE_PATH=
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - DATA_SERVICE_URL=http://data-service:8000
      - DATA_SERVICE_TIMEOUT_MS=60000
      - DATA_SERVICE_RETRIES=2
      - NEXT_PUBLIC_STORAGE_MODE=database
      - NEXT_PUBLIC_BASE_PATH=
      - AUTH_TRUST_HOST=true
      - PYTHON_EXECUTABLE=/opt/venv/bin/python
      - PYTHON_TIMEOUT_MS=300000
      # Auth (from .env.production)
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_URL=${AUTH_URL}
      - AUTH_GOOGLE_ID=${AUTH_GOOGLE_ID}
      - AUTH_GOOGLE_SECRET=${AUTH_GOOGLE_SECRET}
      - AUTH_GITHUB_ID=${AUTH_GITHUB_ID}
      - AUTH_GITHUB_SECRET=${AUTH_GITHUB_SECRET}
      - ADMIN_GITHUB_ID=${ADMIN_GITHUB_ID}
      - LOG_INGEST_SECRET=${LOG_INGEST_SECRET}
      # Database
      - DATABASE_URL=postgresql://stockviewer:${POSTGRES_PASSWORD}@db:5432/stockviewer
    volumes:
      - stockviewer-data:/app/data
    depends_on:
      db:
        condition: service_healthy
      data-service:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stockviewer-network

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=stockviewer
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=stockviewer
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockviewer"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - stockviewer-network

networks:
  stockviewer-network:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:dead:beef::/48

volumes:
  stockviewer-data:
  postgres-data:
