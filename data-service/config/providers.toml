# Provider registry and routing configuration.
#
# Everything here is data, not code: quotas, coverage, licence posture and
# routing order all change on the provider's schedule, not ours, so they must
# be editable without touching an adapter.
#
# Secrets are never stored here. `api_key_setting` names the field on Settings
# (fed from .env) that carries the key, so this file stays safe to commit.
#
# ── On the `verified` flags ────────────────────────────────────────────────
# `verified = true` means the number was observed from this codebase against
# the live API. `verified = false` means it was taken from documentation and
# nobody has confirmed it against a logged-in account. The distinction is the
# point: an unverified limit that is really lower gets us blocked, which has
# already happened once with EastMoney.
#
# Before this is relied on in anger, each entry needs checking against the
# provider's own pricing page and the entitlements visible on the target
# account, and `reviewed_at` set. See the reference URLs in each block.

[gateway]
# Callers reach providers only through this service; nothing else should hold
# a provider key or call a provider host directly.
deny_direct_provider_access = true
default_deadline_ms = 5000

# What this deployment is allowed to do with the data. Kept at the most
# restrictive setting: this runs on a local network for a handful of
# colleagues, and no provider here has been cleared for public display or
# redistribution. Routing refuses any provider whose allowed_usage does not
# include the active context.
usage_context = "internal_research"


# ───────────────────────────── EastMoney ──────────────────────────────────

[providers.eastmoney]
enabled = true
allowed_usage = ["internal_research"]
capabilities = ["ohlcv", "reference"]
# The only provider covering all thirteen canonical sources.
markets = ["CN", "HK", "US", "GLOBAL"]
api_key_setting = ""          # public endpoints, no key
notes = """
Undocumented public JSON endpoints, no published quota and no terms of use we
can point at. Treat the limits below as a self-imposed courtesy budget rather
than a known ceiling: a debugging burst on 2026-08-23 got this machine
refused for hours, which is the only hard evidence we have about its
tolerance. AKShare was removed because it wraps these same endpoints — it was
never a second source.
"""

[providers.eastmoney.limits]
# Deliberately conservative. There is no official number to derive a safety
# margin from, so these are picked to stay far below whatever tripped the
# block rather than to maximise throughput.
requests_per_minute = 30
requests_per_hour = 600
concurrency = 2
min_interval_seconds = 0.5
verified = false
reviewed_at = ""
source = "no official rate-limit documentation exists"

[providers.eastmoney.circuit_breaker]
window = 20
failure_ratio = 0.5
open_seconds = 60


# ─────────────────────────────── Tencent ──────────────────────────────────

[providers.tencent]
enabled = true
allowed_usage = ["internal_research"]
capabilities = ["ohlcv"]
markets = ["CN", "HK", "US"]
api_key_setting = ""          # public endpoints, no key
notes = """
Second independent source for eleven of the thirteen canonical sources. Unofficial
in the same way — no published quota, no terms — but it fails separately,
which is the whole point of having it: when EastMoney refused this machine,
Tencent kept answering.

Rows are [date, open, close, high, low, volume]; close is second, not last.
Cross-checked rather than assumed — 600104 on 2026-08-21 reads 10.14 here,
matching Tiingo, EastMoney and Alpha Vantage independently.
"""

[providers.tencent.limits]
# No published limit. Kept conservative for the same reason as EastMoney: the
# only evidence about an unofficial endpoint's tolerance is the block you earn
# by exceeding it.
requests_per_minute = 30
requests_per_hour = 600
concurrency = 2
min_interval_seconds = 0.5
verified = false
reviewed_at = ""
source = "no official rate-limit documentation exists"

[providers.tencent.circuit_breaker]
window = 20
failure_ratio = 0.5
open_seconds = 60


# ─────────────────────────────── Tiingo ───────────────────────────────────

[providers.tiingo]
enabled = true
# Starter is marked internal-use only; this must not feed public output.
allowed_usage = ["internal_research"]
capabilities = ["ohlcv"]
markets = ["US", "CN"]
api_key_setting = "tiingo_api_key"
notes = """
Carries mainland A-shares under the bare ticker — verified against the live
API: 600104 and 000002 resolve, suffixed forms do not. Depth is the reason it
leads the chain for cn.stock and us.stock: 5038 daily bars back to 2007-01-04
for 600104. It also shares no upstream with EastMoney, so one being blocked
does not take the other down.
"""

[providers.tiingo.limits]
requests_per_hour = 50
requests_per_day = 1000
concurrency = 4
min_interval_seconds = 0.0
# Taken from the design document, not confirmed against the account.
verified = false
reviewed_at = ""
source = "https://www.tiingo.com/about/pricing"

# Declared per key rather than per provider, so a second Tiingo key would be a
# second budget of 50/hour instead of sharing this one.
[[providers.tiingo.credentials]]
id = "primary"
secret_ref = "tiingo_api_key"
priority = 0
notes = """
Starter plan. The symbol and bandwidth budgets below were not tracked at all
before credentials existed: counting requests cannot see either of them
coming, and hitting one presents as an opaque refusal.
"""

[[providers.tiingo.credentials.budgets]]
kind = "requests"
limit = 50
window = "hour"

[[providers.tiingo.credentials.budgets]]
kind = "requests"
limit = 1000
window = "day"

[[providers.tiingo.credentials.budgets]]
kind = "symbols"
limit = 500
window = "month"

[[providers.tiingo.credentials.budgets]]
kind = "bytes"
limit = 1073741824          # 1 GB
window = "month"

[providers.tiingo.circuit_breaker]
window = 20
failure_ratio = 0.5
open_seconds = 60


# ──────────────────────────── Alpha Vantage ───────────────────────────────

[providers.alphavantage]
enabled = true
allowed_usage = ["internal_research"]
capabilities = ["ohlcv"]
markets = ["US", "CN"]
api_key_setting = "alphavantage_api_key"
notes = """
Kept for low-frequency manual checks and as a last resort, not as an
automatic fallback: the daily allowance is too small to carry traffic, and
free-tier daily history is capped at 100 bars because outputsize=full is now
premium — observed directly, not inferred. Adjusted prices are premium too.
A-shares work via .SHH/.SHZ suffixes.
"""

[providers.alphavantage.limits]
requests_per_day = 25
concurrency = 2
# Observed: the API answers a burst with "please spread out your free API
# requests more sparingly (1 request per second)".
min_interval_seconds = 1.2
verified = false            # the 25/day figure itself is still undocumented here
reviewed_at = ""
source = "https://www.alphavantage.co/support/"

[providers.alphavantage.circuit_breaker]
window = 20
failure_ratio = 0.5
open_seconds = 60


# ──────────────────────────────── EODHD ───────────────────────────────────

[providers.eodhd]
enabled = true
allowed_usage = ["internal_research"]
capabilities = ["ohlcv"]
markets = ["AU", "HK", "US"]
api_key_setting = "eodhd_api_key"
notes = """
The only source verified to carry Australia, which had no path at all: BHP.AU
and CBA.AU both return real ASX prices. Also a third Hong Kong path, and the
first one with a contract behind it — 0700.HK agrees with Tencent to the cent.

Free tier is capped at one year of history, confirmed rather than assumed: a
request from 2015 returns the same 253 bars as a request from 2025. That makes
it a coverage source rather than a backtesting one.
"""

[providers.eodhd.limits]
requests_per_day = 20
concurrency = 2
min_interval_seconds = 0.5
# Confirmed from the provider's own /api/user endpoint, which reported
# 5/20 used and subscriptionType "free".
verified = true
reviewed_at = "2026-08-23"
source = "https://eodhd.com/api/user"


# ───────────────────────────── Twelve Data ────────────────────────────────

[providers.twelvedata]
enabled = true
allowed_usage = ["internal_research"]
capabilities = ["ohlcv"]
# US only on this plan. Australia and Hong Kong were both refused with
# "available starting with the Pro or Venture plan", so listing them here
# would be wrong.
markets = ["US"]
api_key_setting = "twelve_api_key"
notes = """
Deepest US history of anything configured: AAPL returns 5000 daily bars back
to 2006, against Tiingo's reach and far beyond Alpha Vantage's 100. With
800 credits a day it is the better US lead, and it shares no upstream with
Tencent or EastMoney.

Metered in credits rather than requests — endpoints and symbol counts cost
differently — so the budget is declared in credits.
"""

[providers.twelvedata.limits]
requests_per_minute = 8
requests_per_day = 800
concurrency = 2
min_interval_seconds = 0.0
# Documentation figures; the plan's market restriction was verified directly
# but the credit numbers were not.
verified = false
reviewed_at = ""
source = "https://twelvedata.com/pricing"


# ──────────────────────────────  Routing  ─────────────────────────────────
#
# Ordered candidate chains per canonical data source. First entry preferred.
# A provider that does not carry a source is filtered out regardless of this
# order, so listing one here is a preference, not an assertion of coverage.

[routing]
"cn.stock"      = ["tiingo", "tencent", "eastmoney", "alphavantage"]
"us.stock"      = ["twelvedata", "tiingo", "tencent", "eastmoney", "alphavantage"]
# Australia had no path at all until EODHD; it is still the only one.
"au.stock"      = ["eodhd"]
"cn.stock.b"    = ["tencent", "eastmoney"]
"cn.stock.cdr"  = ["tencent", "eastmoney"]
# Hong Kong had one source until Tencent; an EastMoney block took the whole
# market with it.
# EODHD is the only Hong Kong source with a contract behind it; the other two
# are undocumented public endpoints.
"hk.stock"      = ["tencent", "eastmoney", "eodhd"]
"cn.index"      = ["tencent", "eastmoney"]
"hk.index"      = ["tencent", "eastmoney"]
"us.index"      = ["tencent", "eastmoney"]
"global.index"  = ["tencent", "eastmoney"]
"cn.etf"        = ["tencent", "eastmoney"]
"cn.lof"        = ["tencent", "eastmoney"]
# Futures remain single-sourced: Tencent's kline endpoint returns nothing for
# contract codes, and no free alternative has been found.
"cn.futures"    = ["eastmoney"]
"global.futures" = ["eastmoney"]

# Applied to sources with no explicit chain, and to the listing endpoints.
default = ["eastmoney", "tencent", "tiingo", "alphavantage"]


# ─────────────────────────────── Caching ──────────────────────────────────

[cache]
# Daily bars settle once per session, so an hour costs nothing in freshness.
ohlcv_daily_ttl_seconds = 3600
# A range ending today holds a bar that is still forming; stop trusting it
# quickly so the close is picked up rather than cached for the full hour.
today_coverage_ttl_seconds = 300
max_series = 512
